<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Concert Ticket Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #565b5a;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      color: white;
      margin: 20px;
    }
    .main {
      display: flex;
      gap: 30px;
      justify-content: center;
      margin: 20px;
    }
    form {
      width: 380px;
      padding: 20px;
      background: linear-gradient(45deg, rgb(255, 251, 129), rgb(255, 124, 174));
      border-radius: 10px;
     
    }
    label {
      font-weight: 600;
      font-size: 15px;
    }
    input, select {
      width: 95%;
      margin: 8px 0;
      padding: 7px;
      border-radius: 8px;
      border: 1px solid gray;
      outline: none;
    }
    input:hover{
      box-shadow: 1px 0px 5px rgba(0, 0, 255, 0.779);
    }
    .time-options , .time-options label{
      display: flex;
      gap:10px;
      justify-content: center;
      font-size: 13px;
    }
    button {
      width: 100%;
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      background: rgb(0, 30, 255);
      border: none;
      color: white;
      font-size: 17px;
    }
    button:hover {
      opacity: 0.8;
      cursor: pointer;
    }

    .ticket {  
      width: 510px;
      height: 230px;
      display: flex;
      border: 2px dashed #222;
      border-radius: 12px;
      overflow: hidden;
      background: white;
      display:none;
      margin-top:80px;
    }
    .ticket-left {
      flex: 1.5;
      background: url("https://images.unsplash.com/photo-1522158637959-30385a09e0da?w=600&auto=format&fit=crop&q=60") no-repeat center;
      background-size: cover;
    }
    .ticket-right {
      flex: 2;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .ticket-right h2 {
      font-size: 28px;
      margin: 0;
      font-weight: bold;
    }
    .ticket-right p {
      margin: 6px 0;
      font-size: 16px;
    }
    .details {
      display: flex;
      gap: 15px;
      margin-top: 10px;
    }
    .details span {
      border: 1px solid #333;
      border-radius: 15px;
      padding: 5px 12px;
      font-size: 14px;
    }
    #qrcode {
      margin-top: 10px;
    }
     
   @media (max-width: 500px) {
  .main {
    flex-direction: column; 
    align-items: center;
  }

  form, .ticket {
    width: 90%; 
  }

  .ticket {
    margin-top: 20px;
  }
}
  
  </style>
</head>
<body>
  <h1>🎫 Concert Ticket Generator</h1>
  <div class="main">
    <form>
      <label for="name">Your Name:</label>
      <input type="text" id="name" placeholder="Enter your name">

      <label for="event">Event Name:</label>
      <input type="text" id="event" placeholder="Enter event name">

      <label for="venue">Venue:</label>
      <input type="text" id="venue" placeholder="Enter venue">

      <label for="date">Date:</label>
      <input type="date" id="date">

      <label for="time">Time:</label>
      <div class="time-options">
        <label><input type="radio" name="time" value="5:00 PM"> 5:00 PM</label>
        <label><input type="radio" name="time" value="9:00 PM"> 9:00 PM</label>
        <label><input type="radio" name="time" value="11:00 PM"> 11:00 PM</label>
      </div>

      <label for="price">Price:</label>
      <input type="text" id="price" readonly value="$0">

      <label for="seatType">Seat Type:</label>
      <select id="seatType" onchange="updatePrice()">
        <option disabled selected>Select Seat Type</option>
        <option value="VIP">VIP</option>
        <option value="Regular">Regular</option>
      </select>

      <button type="button" onclick="generateTicket()">Generate Ticket</button>
    </form>

    <div class="ticket" id="ticket">
      <div class="ticket-left">

      </div>
      <div class="ticket-right">
        <div>
          <p id="ticketVenue">Venue</p>
          <h2 id="ticketEvent">Event</h2>
          <div class="details">
            <span id="ticketDate">Date</span>
            <span id="ticketTime">Time</span>
            <span id="ticketPrice">Price</span>
          </div>
          <p id="ticketSeat">Seat</p>
          <p id="ticketName">Name</p>
        </div>
      </div>
    </div>
  </div>

<script>
function updatePrice() {
  const seatType = document.getElementById("seatType").value;
  let price = "$0";
  if (seatType === "VIP") price = "$30";
  if (seatType === "Regular") price = "$15";
  document.getElementById("price").value = price;
}

function generateTicket() {
  const name = document.getElementById("name").value;
  const event = document.getElementById("event").value;
  const venue = document.getElementById("venue").value;
  const date = document.getElementById("date").value;
  const time = document.querySelector('input[name="time"]:checked')?.value || "";
  const price = document.getElementById("price").value;
  const seatType = document.getElementById("seatType").value;


  document.getElementById("ticketName").innerText = "Name: " + name;
  document.getElementById("ticketEvent").innerText = event;
  document.getElementById("ticketVenue").innerText = venue;
  document.getElementById("ticketDate").innerText = date;
  document.getElementById("ticketTime").innerText = time;
  document.getElementById("ticketPrice").innerText = "Price: " + price;
  document.getElementById("ticketSeat").innerText = "Seat: " + seatType;

  document.getElementById("ticket").style.display = "flex";

  // html2pdf().from(document.getElementById('ticket')).save(`${ticketName}.pdf`);
}
</script>
</body>
</html>
